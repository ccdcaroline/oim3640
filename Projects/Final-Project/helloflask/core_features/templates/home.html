<!doctype html>
<html>
<head>
  <title>Core Features Workout</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 760px; margin: 30px auto; padding: 0 12px; background: #f8fafc; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 18px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    label { display: block; margin-bottom: 6px; color: #374151; font-size: 14px; }
    input, select { width: 100%; padding: 9px; border: 1px solid #d1d5db; border-radius: 8px; box-sizing: border-box; }
    button { margin-top: 14px; padding: 10px 14px; border: none; border-radius: 8px; background: #2563eb; color: white; cursor: pointer; }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <h1>Core Features</h1>
  <p>Simple personalized workout by mood, energy, and goal.</p>

  <form method="post" action="/plan" class="card">
    <div class="grid">
      <div>
        <label>Mood</label>
        <select name="mood" required>
          <option value="happy">Happy</option>
          <option value="stressed">Stressed</option>
          <option value="tired">Tired</option>
          <option value="motivated">Motivated</option>
        </select>
      </div>

      <div>
        <label>Energy (1-10)</label>
        <input type="number" name="energy" min="1" max="10" value="5" required>
      </div>

      <div>
        <label>Goal</label>
        <select name="goal" required>
          <option value="strength">Strength</option>
          <option value="fat loss">Fat Loss</option>
          <option value="mobility">Mobility</option>
        </select>
      </div>
    </div>

    <button type="submit">Get Workout</button>
  </form>
</body>
</html>
