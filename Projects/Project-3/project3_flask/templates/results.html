<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Result</title>
</head>
<body>
  <h1>Result</h1>

  {% if error %}
    <p style="color: red;">{{ error }}</p>
  {% else %}
    <p>You entered: <strong>{{ place }}</strong></p>
    <p>Nearest stop: <strong>{{ stop_name }}</strong></p>
    <p>Wheelchair accessible: <strong>{{ "Yes" if accessible else "No" }}</strong></p>
  {% endif %}

  <p><a href="/">Search again</a></p>
</body>
</html>
