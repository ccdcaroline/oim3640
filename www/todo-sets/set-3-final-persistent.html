<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo Progression - Set 3 Final</title>
  <style>
    :root {
      --bg: #0f1222;
      --panel: #171a31;
      --panel-2: #1f2443;
      --text: #eff2ff;
      --muted: #aeb5dd;
      --accent: #65d6ff;
      --accent-2: #7a89ff;
      --danger: #ff6f8f;
      --success: #57d7a7;
      --border: #323a66;
      --shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, Segoe UI, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 8% 10%, rgba(122, 137, 255, 0.35) 0, transparent 42%),
        radial-gradient(circle at 92% 85%, rgba(101, 214, 255, 0.28) 0, transparent 36%),
        var(--bg);
    }

    .app {
      width: min(860px, 100%);
      background: linear-gradient(160deg, var(--panel), var(--panel-2));
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.45rem, 2vw, 2rem);
    }

    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .stats {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.02);
      color: var(--muted);
      font-size: 0.9rem;
      min-width: 150px;
      text-align: right;
    }

    .input-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-bottom: 14px;
    }

    input[type="text"] {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      background: #11162d;
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    input[type="text"]::placeholder {
      color: #7880ad;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(101, 214, 255, 0.2);
    }

    button {
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button:active {
      transform: translateY(1px);
    }

    .add-btn {
      border-radius: 12px;
      padding: 12px 18px;
      color: #0d1124;
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      padding: 8px 12px;
    }

    .filter-btn.active {
      color: #0d1124;
      border-color: transparent;
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
    }

    .clear-btn {
      border-radius: 10px;
      padding: 8px 12px;
      background: rgba(255, 111, 143, 0.12);
      color: #ffb2c2;
      border: 1px solid rgba(255, 111, 143, 0.3);
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 10px;
    }

    .task {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
      background: #121730;
    }

    .task.completed {
      border-color: rgba(87, 215, 167, 0.35);
      background: rgba(87, 215, 167, 0.08);
    }

    .task-text {
      word-break: break-word;
      line-height: 1.4;
    }

    .task.completed .task-text {
      color: #8f96c2;
      text-decoration: line-through;
    }

    .delete-btn {
      border-radius: 10px;
      padding: 8px 10px;
      background: rgba(255, 111, 143, 0.14);
      color: #ffb5c5;
      border: 1px solid rgba(255, 111, 143, 0.35);
    }

    .empty {
      border: 1px dashed var(--border);
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="header">
      <div>
        <h1>To-Do List (Set 3 - Final)</h1>
        <p class="subtitle">Final version: add, complete, delete, filter, and save tasks.</p>
      </div>
      <div id="stats" class="stats">0 total • 0 active • 0 done</div>
    </div>

    <form id="todoForm" class="input-row">
      <input id="todoInput" type="text" placeholder="What do you want to get done?" autocomplete="off" />
      <button class="add-btn" type="submit">Add Task</button>
    </form>

    <div class="toolbar">
      <div class="filters">
        <button type="button" class="filter-btn active" data-filter="all">All</button>
        <button type="button" class="filter-btn" data-filter="active">Not Completed</button>
        <button type="button" class="filter-btn" data-filter="completed">Completed</button>
      </div>
      <button id="clearCompletedBtn" type="button" class="clear-btn">Clear Completed</button>
    </div>

    <ul id="todoList"></ul>
    <p id="emptyState" class="empty">No tasks to show. Add a new one above.</p>
  </main>

  <script>
    const STORAGE_KEY = "todo-final-v3";

    const todoForm = document.getElementById("todoForm");
    const todoInput = document.getElementById("todoInput");
    const todoList = document.getElementById("todoList");
    const emptyState = document.getElementById("emptyState");
    const filterButtons = document.querySelectorAll(".filter-btn");
    const clearCompletedBtn = document.getElementById("clearCompletedBtn");
    const stats = document.getElementById("stats");

    let tasks = [];
    let activeFilter = "all";

    function loadTasks() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];

      try {
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) return [];
        return parsed.filter((item) =>
          item &&
          typeof item.id === "string" &&
          typeof item.text === "string" &&
          typeof item.completed === "boolean"
        );
      } catch {
        return [];
      }
    }

    function saveTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    function getVisibleTasks() {
      if (activeFilter === "completed") return tasks.filter((task) => task.completed);
      if (activeFilter === "active") return tasks.filter((task) => !task.completed);
      return tasks;
    }

    function updateStats() {
      const total = tasks.length;
      const completed = tasks.filter((t) => t.completed).length;
      const active = total - completed;
      stats.textContent = `${total} total • ${active} active • ${completed} done`;
    }

    function render() {
      const visibleTasks = getVisibleTasks();
      todoList.innerHTML = "";
      emptyState.style.display = visibleTasks.length === 0 ? "block" : "none";

      visibleTasks.forEach((task) => {
        const li = document.createElement("li");
        li.className = "task";
        if (task.completed) li.classList.add("completed");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.completed;
        checkbox.addEventListener("change", () => {
          task.completed = checkbox.checked;
          saveTasks();
          render();
        });

        const span = document.createElement("span");
        span.className = "task-text";
        span.textContent = task.text;

        const delBtn = document.createElement("button");
        delBtn.type = "button";
        delBtn.className = "delete-btn";
        delBtn.textContent = "Delete";
        delBtn.addEventListener("click", () => {
          tasks = tasks.filter((item) => item.id !== task.id);
          saveTasks();
          render();
        });

        li.append(checkbox, span, delBtn);
        todoList.appendChild(li);
      });

      filterButtons.forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.filter === activeFilter);
      });

      updateStats();
    }

    todoForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = todoInput.value.trim();
      if (!text) return;

      tasks.unshift({
        id: crypto.randomUUID(),
        text,
        completed: false
      });

      saveTasks();
      todoInput.value = "";
      todoInput.focus();
      render();
    });

    filterButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        activeFilter = btn.dataset.filter;
        render();
      });
    });

    clearCompletedBtn.addEventListener("click", () => {
      tasks = tasks.filter((task) => !task.completed);
      saveTasks();
      render();
    });

    tasks = loadTasks();
    render();
  </script>
</body>
</html>
