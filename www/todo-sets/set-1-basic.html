<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo Progression - Set 1</title>
  <style>
    :root {
      --bg: #f3f5ff;
      --panel: #ffffff;
      --text: #1f2550;
      --muted: #6d7397;
      --accent: #6c5ce7;
      --accent-2: #8f83ff;
      --danger: #ff4f74;
      --border: #dfe3ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, Segoe UI, Arial, sans-serif;
      background:
        radial-gradient(circle at 10% 15%, #e6ebff 0, transparent 40%),
        radial-gradient(circle at 90% 85%, #e9ddff 0, transparent 38%),
        var(--bg);
      color: var(--text);
      padding: 24px;
    }

    .app {
      width: min(720px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 18px 40px rgba(58, 53, 128, 0.12);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.4rem, 2vw, 1.8rem);
    }

    .subtitle {
      margin: 0 0 20px;
      color: var(--muted);
    }

    .input-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-bottom: 16px;
    }

    input {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 1rem;
      outline: none;
    }

    input:focus {
      border-color: var(--accent-2);
      box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.12);
    }

    button {
      border: 0;
      cursor: pointer;
      border-radius: 12px;
      padding: 12px 16px;
      font-weight: 600;
    }

    .add-btn {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 10px;
    }

    .task {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 10px;
      background: #fbfbff;
    }

    .task.completed .task-text {
      color: #8a8fb2;
      text-decoration: line-through;
    }

    .task-text {
      word-break: break-word;
    }

    .delete-btn {
      background: #ffe9ee;
      color: var(--danger);
      padding: 8px 12px;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 14px;
      padding: 20px;
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>To-Do List (Set 1)</h1>
    <p class="subtitle">Baseline version: add, complete, and delete tasks.</p>

    <form id="todoForm" class="input-row">
      <input id="todoInput" type="text" placeholder="Type a new task..." autocomplete="off" />
      <button class="add-btn" type="submit">Add</button>
    </form>

    <ul id="todoList"></ul>
    <p id="emptyState" class="empty">No tasks yet. Add your first task.</p>
  </main>

  <script>
    const todoForm = document.getElementById("todoForm");
    const todoInput = document.getElementById("todoInput");
    const todoList = document.getElementById("todoList");
    const emptyState = document.getElementById("emptyState");

    const tasks = [];

    function render() {
      todoList.innerHTML = "";
      emptyState.style.display = tasks.length === 0 ? "block" : "none";

      tasks.forEach((task) => {
        const li = document.createElement("li");
        li.className = "task";
        if (task.completed) li.classList.add("completed");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.completed;
        checkbox.addEventListener("change", () => {
          task.completed = checkbox.checked;
          render();
        });

        const span = document.createElement("span");
        span.className = "task-text";
        span.textContent = task.text;

        const delBtn = document.createElement("button");
        delBtn.className = "delete-btn";
        delBtn.type = "button";
        delBtn.textContent = "Delete";
        delBtn.addEventListener("click", () => {
          const idx = tasks.findIndex((item) => item.id === task.id);
          if (idx >= 0) tasks.splice(idx, 1);
          render();
        });

        li.append(checkbox, span, delBtn);
        todoList.appendChild(li);
      });
    }

    todoForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = todoInput.value.trim();
      if (!text) return;

      tasks.unshift({
        id: crypto.randomUUID(),
        text,
        completed: false
      });

      todoInput.value = "";
      todoInput.focus();
      render();
    });

    render();
  </script>
</body>
</html>
